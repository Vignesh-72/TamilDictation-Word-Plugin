<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <style>
        body { 
            font-family: 'Segoe UI', sans-serif; text-align: center; padding: 20px; 
            background: #ffffff; color: #323130; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; height: 100vh; margin: 0;
        }
        .pulse-ring {
            width: 50px; height: 50px; background: #d13438; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 0 0 rgba(209, 52, 56, 0.7); animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(209, 52, 56, 0.7); }
            70% { box-shadow: 0 0 0 20px rgba(209, 52, 56, 0); }
            100% { box-shadow: 0 0 0 0 rgba(209, 52, 56, 0); }
        }
        .status { font-size: 12px; font-weight: 700; color: #d13438; margin-top: 20px; text-transform: uppercase; }
        .lang-badge { font-size: 10px; color: #666; background: #eee; padding: 2px 6px; border-radius: 4px; margin-top: 5px; }
        .transcript { font-size: 20px; margin-top: 15px; color: #201f1e; line-height: 1.4; }
    </style>
</head>
<body>
    <div class="pulse-ring">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="white"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
    </div>
    <div class="status">Listening...</div>
    <div class="lang-badge" id="langBadge">ta-IN</div>
    <div class="transcript" id="out">...</div>

    <script>
        function clean(t) { return t.replace(/(^|\s)[ப்ஃ](\s|$)/g, '$1$2').replace(/^[ப்ஃ]/, '').trim(); }
        
        Office.onReady(() => {
            const params = new URLSearchParams(window.location.search);
            
            const listenLang = params.get('lang') || 'ta-IN';
            document.getElementById('langBadge').innerText = listenLang === 'en-IN' ? 'ENGLISH MODE' : 'TAMIL MODE';
            
            // Apply the user's selected font to the live preview
            const userFont = params.get('font') || 'TAU-Marutham';
            document.getElementById('out').style.fontFamily = `"${userFont}", sans-serif`;

            const Speech = window.webkitSpeechRecognition || window.SpeechRecognition;
            let rec = new Speech();
            rec.continuous = true; 
            rec.interimResults = true; 
            
            rec.lang = listenLang;
            
            rec.onresult = (e) => {
                let inter = ''; let final = '';
                for (let i = e.resultIndex; i < e.results.length; i++) {
                    let s = clean(e.results[i][0].transcript);
                    if (e.results[i].isFinal) final += s; else inter += s;
                }
                if (final) {
                    Office.context.ui.messageParent(JSON.stringify({ text: final, isFinal: true }));
                    rec.stop();
                } else {
                    Office.context.ui.messageParent(JSON.stringify({ text: inter, isFinal: false }));
                }
                document.getElementById("out").innerText = final || inter;
            };
            rec.onend = () => { rec.start(); };
            rec.start();
        });
    </script>
</body>
</html>
